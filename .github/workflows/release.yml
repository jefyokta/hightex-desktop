name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun install

      - name: Build default plugins
        run: bun run build:plugin

      - name: Sign default plugins
        run: bun run sign:plugin
        env:
          PLUGIN_PRIVATE_KEY: ${{ secrets.PLUGIN_PRIVATE_KEY }}
          PLUGIN_KEY_ID: hightex-core

      - name: Generate public key
        run: node scripts/generate-public-key.js
        env:
          PLUGIN_PRIVATE_KEY: ${{ secrets.PLUGIN_PRIVATE_KEY }}

      - name: Build mac
        if: matrix.os == 'macos-latest'
        run: bun run build:mac

      - name: Build win
        if: matrix.os == 'windows-latest'
        run: bun run build:win

      - name: Build linux
        if: matrix.os == 'ubuntu-latest'
        run: bun run build:linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            release/**

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/release/**/*.exe
            **/release/**/*.dmg
            **/release/**/*.AppImage
            **/release/**/*.blockmap
            **/release/**/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
