name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      has_notes: ${{ steps.check.outputs.has_notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: RELEASE_NOTE.md

      - name: Check notes exist
        id: check
        run: |
          if [ -s RELEASE_NOTE.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTE.md

  build:
    needs: changelog
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun install

      - name: Rebuild native dependencies
        run: bunx electron-builder install-app-deps

      - name: Build default plugins
        run: bun run build:plugin

      - name: Sign default plugins
        run: bun run sign:plugin
        env:
          PLUGIN_PRIVATE_KEY: ${{ secrets.PLUGIN_PRIVATE_KEY }}
          PLUGIN_KEY_ID: hightex-core

      - name: Generate public key
        run: node scripts/generate-public-key.js
        env:
          PLUGIN_PRIVATE_KEY: ${{ secrets.PLUGIN_PRIVATE_KEY }}

      - name: Build mac
        if: matrix.os == 'macos-latest'
        run: bun run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build win
        if: matrix.os == 'windows-latest'
        run: bun run build:win

      - name: Build linux
        if: matrix.os == 'ubuntu-latest'
        run: bun run build:linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            release/**

  release:
    needs: [build, changelog]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find . -type f \( \
            -name "*.exe" -o \
            -name "*.dmg" -o \
            -name "*.zip" -o \
            -name "*.AppImage" -o \
            -name "*.blockmap" -o \
            -name "*.yml" \
          \) -exec cp {} release-assets/ \;

          if ! find release-assets -type f | grep -q .; then
            echo "No release assets found after artifact download"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          ls -la release-assets

      - name: Add update to server
        shell: bash
        continue-on-error: true
        run: |
          VERSION="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"

          WINDOWS=$(find release-assets -name "*.exe" | grep -i "windows\|setup" | head -n 1)
          MAC=$(find release-assets -name "*.dmg" | head -n 1)
          LINUX=$(find release-assets -name "*.AppImage" | head -n 1)

          curl -X POST "https://hightex.jefyokta.my.id/gh/release/snapshot" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SERVER_TOKEN }}" \
            -d "{
              \"version\": \"$VERSION\",
              \"repo\": \"$REPO\",
              \"assets\": {
                \"windows\": \"$WINDOWS\",
                \"mac\": \"$MAC\",
                \"linux\": \"$LINUX\"
              }
            }" || echo "Server update failed, continuing anyway"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ needs.changelog.outputs.has_notes }}" == "true" ]; then
            NOTES_ARGS="--notes-file release-notes/RELEASE_NOTE.md"
          else
            NOTES_ARGS="--generate-notes"
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" $NOTES_ARGS
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "$GITHUB_REF_NAME" \
              $NOTES_ARGS
          fi