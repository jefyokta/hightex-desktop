[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""

body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased]
{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}

{% endfor %}
"""

trim = true
footer = ""

[git]
conventional_commits = true

filter_unconventional = false
require_conventional = false

split_commits = false
protect_breaking_commits = true
filter_commits = false
fail_on_unmatched_commit = false

tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""

topo_order = false
topo_order_commits = true
sort_commits = "oldest"

commit_parsers = [

    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps", skip = true },
    { message = "^chore\\(dependabot", skip = true },
    { message = "^Merge ", skip = true },
    { message = "^merge ", skip = true },

    { body = "(?i).*security.*", group = "🔒 Security" },

    { message = "^feat(?:\\([^)]*\\))?!?:", group = "✨ Features" },
    { message = "^fix(?:\\([^)]*\\))?!?:", group = "🐛 Bug Fixes" },
    { message = "^perf(?:\\([^)]*\\))?!?:", group = "⚡ Performance" },
    { message = "^refactor(?:\\([^)]*\\))?!?:", group = "♻️ Refactor" },


    { message = "^docs?(?:\\([^)]*\\))?!?:", group = "📝 Documentation" },
    { message = "^test(?:\\([^)]*\\))?!?:", group = "✅ Testing" },
    { message = "^style(?:\\([^)]*\\))?!?:", group = "🎨 Styling" },


    { message = "^build(?:\\([^)]*\\))?!?:", group = "📦 Build" },
    { message = "^ci(?:\\([^)]*\\))?!?:", group = "👷 CI" },
    { message = "^update(?:\\([^)]*\\))?!?:", group = "🔄 Updates" },
    { message = "^chore(?:\\([^)]*\\))?!?:", group = "🔧 Miscellaneous" },


]

