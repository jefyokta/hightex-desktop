<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script>
      const load = (iframeElement) => {
        const iframeWindow = iframeElement.contentWindow;

        class HelloWorldEl extends iframeWindow.HTMLElement {
          connectedCallback() {
            this.innerHTML = "<h1>hello world dari iframe!</h1>";
          }
        }
        if (!iframeWindow.customElements.get("hello-world")) {
          iframeWindow.customElements.define("hello-world", HelloWorldEl);
        }
      };
    </script>
  </head>
  <body>
    <iframe
      onload="load(this)"
      srcdoc="<hello-world></hello-world>"
      frameborder="1"
    >
    </iframe>
  </body>
</html>
